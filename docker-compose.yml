version: "3.9"
services:
  ai-toolkit:
    # If a prebuilt image isn't available to you, build from the repo's Dockerfile instead.
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: "unless-stopped"
    shm_size: "32gb"
    ports:
      - "8675:8675"         # Web UI
    environment:
      - HF_TOKEN=${HF_TOKEN}                          # Hugging Face token (accept Wan2.2 licenses first)
      - TZ=UTC
    volumes:
      - /comfy/datasets/train:/app/ai-toolkit/datasets
      - ./output:/app/ai-toolkit/output
      - ./config:/app/ai-toolkit/config
      - ./hf_cache:/root/.cache/huggingface/hub
    # Newer Docker Compose supports this directly:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # If not using Swarm, you can alternatively add: gpus: all